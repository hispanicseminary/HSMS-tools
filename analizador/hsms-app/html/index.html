html, body {

/* Igualar anchura de los contenedores laterales y central */

#files {

#content {

/* Barra superior estilo Navbar de Sandstone */
/* Contenedor superior con Flexbox */
#barra {
    width: 100%;
    min-height: 150px;

    background-color: #f8f5f0;
    border-bottom: 1px solid #2b2c28;

/* Inserta la imagen a la izquierda de #barra automáticamente vía CSS */
#barra::before {

function processCorpus (folderPathCorpus) {
alert(folderPathCorpus);
		if (folderPathCorpus != "") {

			folderPathCorpus = folderPathCorpus.replace(/\\/g, "/");

					// executes program

					document.getElementById("files").innerHTML += "<li onClick=\"openFile(\'"+myHTMLfileb+"\');\">"+myHTMLfile2b+"</li>";
				}
			}
		}
}


function openFolderDialog () {
    var inputField = document.querySelector('#folderSelector');
	var contenidos = "";
    inputField.addEventListener('change', function () {
		document.getElementById("files").innerHTML = "<b>Textos encontrados:</b><br><br>";
		var fs = require('fs');
        var folderPath = this.value;
		inputField.value = "";
		var filenames;
		fs.readdir(folderPath, function (err, filenames) {   //"."On behalf of the current path of the file content
			var i;  
			for (i = 0; i <filenames.length; i++) {  //Cyclic acquisition documents
				if(filenames[i].substring(filenames[i].lastIndexOf("."))==".html"){
					var myHTMLfile = folderPath+"/"+filenames[i];
					myHTMLfile = myHTMLfile.replace(/\\/g, "/");
					var myfolderPath = folderPath.replace(/\\/g, "/");
					var myHTMLfile2 = myHTMLfile.replace(/\.html/, "");
					myHTMLfile2 = myHTMLfile2.replace(/.+\//, "");
					document.getElementById("files").innerHTML += "<li onClick=\"openFile(\'"+myHTMLfile+"\');\">"+myHTMLfile2+"</li>";
				}
			}  
		}); 
    }, false);
	document.getElementById("files").innerHTML = "<b>Elegir la carpeta con los textos que se desean visualizar</b><br><br>";
    inputField.click();
}

function getSelectionHtml() {
    var html = "";
    if (typeof window.getSelection != "undefined") {
        var sel = window.getSelection();
        if (sel.rangeCount) {
            var container = document.createElement("div");
            for (var i = 0, len = sel.rangeCount; i < len; ++i) {
                container.appendChild(sel.getRangeAt(i).cloneContents());
            }
            html = container.innerHTML;
        }
    } else if (typeof document.selection != "undefined") {
        if (document.selection.type == "Text") {
            html = document.selection.createRange().htmlText;
        }
    }
    return(html);
}

function replaceSelectionWithHtml() {
    var range, html;
	html = getSelectionHtml();
	html = '<div style="display: inline; background-color: yellow">' + html + '</div>';
    if (window.getSelection && window.getSelection().getRangeAt) {
        range = window.getSelection().getRangeAt(0);
        range.deleteContents();
        var div = document.createElement("div");
        div.innerHTML = html;
        var frag = document.createDocumentFragment(), child;
        while ( (child = div.firstChild) ) {
            frag.appendChild(child);
        }
        range.insertNode(frag);
    } else if (document.selection && document.selection.createRange) {
        range = document.selection.createRange();
        range.pasteHTML(html);
    }
}

	scrollToPosition($($('match')[position -= 1]));

	//$($('match')[position]).parent().click();
	$("#ocurrencias").html(fakeposition + " de <span>" + tokens + " ocurrencias</span>");
